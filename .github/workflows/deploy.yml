name: テストして GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "test/*.test.mjs"
      # 公開するファイルだけを _site に集める（test/・tools/・.github/ などは出さない）
      - run: |
          mkdir _site
          cp index.html style.css app.js logic.js data.js sw.js manifest.json \
             icon.svg icon-192.png icon-512.png apple-touch-icon.png LICENSE _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
